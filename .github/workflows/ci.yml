name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Suite di conformita' (I1-I10)
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test end-to-end (§15)
        run: ./scripts/test_smoke.sh
      - name: Stress test di concorrenza (scrittori simultanei, crash, conflitti)
        run: |
          git config --global user.email "ci@arena.test"
          git config --global user.name "arena ci"
          python3 scripts/stress_test.py --users 20 --bets 4 --runners 6 \
            --rounds 10 --crash-rate 0.3
      - name: Invarianti sullo stato committato
        # verify_state e' piu' severo di rebuild_balances: oltre a catena e
        # saldi controlla nonce, pool, idempotenza, ricevute e conservazione
        # globale. E' lo stesso verificatore usato dallo stress test e dal
        # test di accettazione.
        run: python3 scripts/verify_state.py
