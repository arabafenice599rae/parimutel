name: register

# ATTENZIONE (§5.4): con repo PUBBLICO i log del run sono pubblici, quindi
# `print_config` va lasciato a false e va usato `recipient` (chiave age
# dell'owner): il config viene stampato cifrato e si decifra in locale.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: "chiave pubblica age dell'owner (repo pubblico)"
        required: false
        default: ""
      print_config:
        description: "Stampa il config in CHIARO nel log: solo se il repo e' privato"
        required: false
        type: boolean
        default: false
      note:
        description: "Nota operativa, non finisce nel config dell'utente"
        required: false
        default: ""

concurrency:
  group: ledger-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      USER_SECRETS: ${{ secrets.USER_SECRETS }}
      AGE_KEY: ${{ secrets.AGE_KEY }}
      RECIPIENT: ${{ github.event.inputs.recipient }}
      PRINT_CONFIG: ${{ github.event.inputs.print_config }}
    steps:
      - uses: actions/checkout@v4

      - name: Installa age
        if: env.AGE_KEY != '' || env.RECIPIENT != ''
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Registra l'utente
        env:
          IN_NOTE: ${{ github.event.inputs.note }}
        # Come in settle.yml: gli argomenti si costruiscono in bash, perche' un
        # input booleano puo' arrivare come stringa o come booleano JSON. Qui il
        # verso pericoloso dell'errore e' stampare un segreto in un log
        # pubblico, quindi --print-config richiede un "true" esatto.
        run: |
          set -euo pipefail
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; printf '%s' "${s%"${s##*[![:space:]]}"}"; }

          args=(--repo "${{ github.repository }}" --branch "${{ github.ref_name }}")
          if [ -n "$IN_NOTE" ]; then
            args+=(--note "$IN_NOTE")
          fi
          recipient="$(trim "$RECIPIENT")"
          if [ -n "$recipient" ]; then
            args+=(--recipient "$recipient")
          fi
          if [ "$PRINT_CONFIG" = "true" ]; then
            args+=(--print-config)
          fi
          args+=(--commit)

          python3 scripts/register.py "${args[@]}"
