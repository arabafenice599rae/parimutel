name: credit

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "user_id destinatario (es. u_ab12ef34)"
        required: true
      amount:
        description: "Punti da accreditare; negativo = rettifica (es. 10000)"
        required: true
      reason:
        description: "Nota operativa, finisce nel ledger"
        required: false
        default: ""
      credit_id:
        description: "id idempotente; lascia vuoto per generarlo"
        required: false
        default: ""

concurrency:
  group: ledger-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  credit:
    runs-on: ubuntu-latest
    env:
      IN_USER: ${{ github.event.inputs.user_id }}
      IN_AMOUNT: ${{ github.event.inputs.amount }}
      IN_REASON: ${{ github.event.inputs.reason }}
      IN_CREDIT_ID: ${{ github.event.inputs.credit_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Accredita
        run: |
          set -euo pipefail
          trim() { local s="$1"; s="${s#"${s%%[![:space:]]*}"}"; printf '%s' "${s%"${s##*[![:space:]]}"}"; }

          args=(--user "$(trim "$IN_USER")" --amount "$(trim "$IN_AMOUNT")")
          if [ -n "$IN_REASON" ]; then
            args+=(--reason "$IN_REASON")
          fi
          credit_id="$(trim "$IN_CREDIT_ID")"
          if [ -n "$credit_id" ]; then
            args+=(--id "$credit_id")
          fi
          args+=(--commit)

          echo "credit.py ${args[*]}"
          python3 scripts/credit.py "${args[@]}"

      - name: Verifica le invarianti
        run: python3 scripts/rebuild_balances.py
