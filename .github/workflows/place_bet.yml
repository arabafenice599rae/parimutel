name: place_bet

# Canale alternativo (§7.5): un run per scommessa. Semplice, ma ~20-40s a bet.
# Per il multiutente conviene la coda di Issue (drain.yml).
on:
  workflow_dispatch:
    inputs:
      bet:
        description: "Payload JSON firmato della bet (§3.6)"
        required: true

concurrency:
  group: ledger-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  place:
    runs-on: ubuntu-latest
    env:
      BET_JSON: ${{ github.event.inputs.bet }}
      USER_SECRETS: ${{ secrets.USER_SECRETS }}
      AGE_KEY: ${{ secrets.AGE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Installa age (solo se i segreti sono cifrati)
        if: env.AGE_KEY != ''
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Applica la bet
        # Solo il codice 10 (bet RIFIUTATA dalla validazione) vale come
        # successo del run: la ricevuta e' in receipts.json e l'infrastruttura
        # ha funzionato. Qualunque altro codice -> run rosso, perche' un bug di
        # git, filesystem o configurazione non deve passare inosservato.
        run: |
          set -uo pipefail
          python3 scripts/place_bet.py --commit && status=0 || status=$?
          case "$status" in
            0)  echo "bet applicata" ;;
            10) echo "::notice::bet rifiutata dalla validazione: la ricevuta e' in receipts.json" ;;
            11) echo "::error::push rifiutato da uno scrittore concorrente: rilanciare il run"; exit 1 ;;
            *)  echo "::error::errore di infrastruttura (exit $status)"; exit "$status" ;;
          esac

      - name: Verifica le invarianti
        run: python3 scripts/rebuild_balances.py
